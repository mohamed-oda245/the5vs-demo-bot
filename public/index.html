<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Smile Dental Clinic - WhatsApp Demo</title>
<style>
  :root {
    --wa-bg: #0b141a;
    --wa-header: #202c33;
    --wa-in: #202c33;
    --wa-out: #005c4b;
    --wa-text: #e9edef;
    --wa-muted: #8696a0;
    --wa-green: #00a884;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--wa-bg);
    color: var(--wa-text);
    display: flex; flex-direction: column;
  }
  header {
    background: var(--wa-header);
    padding: 10px 14px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid #2a3942;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--wa-green);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .peer { flex: 1; min-width: 0; }
  .peer .name { font-weight: 600; font-size: 16px; }
  .peer .status { font-size: 12px; color: var(--wa-muted); }
  #chat {
    flex: 1; overflow-y: auto;
    padding: 16px 12px 8px;
    display: flex; flex-direction: column; gap: 4px;
    background-image: radial-gradient(circle at 1px 1px, #182229 1px, transparent 0);
    background-size: 22px 22px;
  }
  .msg {
    max-width: 82%;
    padding: 8px 10px 6px;
    border-radius: 8px;
    font-size: 14.5px; line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
    position: relative;
    animation: pop .15s ease-out;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } }
  .msg .time {
    display: inline-block; float: inline-end;
    font-size: 11px; color: var(--wa-muted);
    margin: 6px 0 0 8px;
  }
  .msg.out .time::after { content: ' ✓✓'; color: #53bdeb; }
  .msg.in  { background: var(--wa-in);  align-self: flex-start; border-start-start-radius: 0; }
  .msg.out { background: var(--wa-out); align-self: flex-end;   border-start-end-radius: 0; }
  .msg.rtl { direction: rtl; text-align: right; }
  .msg.ltr { direction: ltr; text-align: left; }
  .typing {
    align-self: flex-start; background: var(--wa-in);
    border-radius: 8px; border-start-start-radius: 0;
    padding: 12px 14px; display: none; gap: 4px;
  }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--wa-muted); display: inline-block;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
  #chips {
    display: flex; gap: 8px; padding: 8px 12px;
    overflow-x: auto; flex-shrink: 0;
  }
  .chip {
    background: transparent; color: var(--wa-green);
    border: 1px solid var(--wa-green);
    border-radius: 18px; padding: 6px 14px;
    font-size: 13px; white-space: nowrap; cursor: pointer;
  }
  .chip:active { background: rgba(0,168,132,.15); }
  #composer {
    display: flex; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: var(--wa-header); flex-shrink: 0;
  }
  #input {
    flex: 1; background: #2a3942; color: var(--wa-text);
    border: none; border-radius: 20px; padding: 10px 16px;
    font-size: 15px; outline: none;
  }
  #send {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--wa-green); color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  footer {
    text-align: center; font-size: 11px; color: var(--wa-muted);
    padding: 4px; background: var(--wa-header);
  }
</style>
</head>
<body>
  <header>
    <div class="avatar">🦷</div>
    <div class="peer">
      <div class="name" id="clinicName">Smile Dental Clinic</div>
      <div class="status" id="status">online</div>
    </div>
  </header>

  <div id="chat"></div>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>

  <div id="chips">
    <button class="chip">بكام الفينير؟ 💰</button>
    <button class="chip">عايز أحجز ميعاد 📅</button>
    <button class="chip">ضرسي بيوجعني 😖</button>
    <button class="chip">عايز أكلم حد من العيادة 👤</button>
    <button class="chip">Do you speak English?</button>
  </div>

  <div id="composer">
    <input id="input" placeholder="Message" autocomplete="off" />
    <button id="send" aria-label="send">➤</button>
  </div>
  <footer>Interactive demo built by the5vs - this is a simulation, not a real clinic</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const typing = document.getElementById('typing');
const sessionId = localStorage.getItem('demoSession') ||
  (() => { const id = 'web-' + Math.random().toString(36).slice(2); localStorage.setItem('demoSession', id); return id; })();

const isAr = (t) => /[\u0600-\u06FF]/.test(t);
const now = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who + (isAr(text) ? ' rtl' : ' ltr');
  div.textContent = text;
  const t = document.createElement('span');
  t.className = 'time';
  t.textContent = now();
  div.appendChild(t);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send(text) {
  const msg = (text || input.value).trim();
  if (!msg) return;
  input.value = '';
  addMsg(msg, 'out');
  typing.style.display = 'flex';
  chat.scrollTop = chat.scrollHeight;
  document.getElementById('status').textContent = 'typing...';
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, text: msg }),
    });
    const data = await res.json();
    typing.style.display = 'none';
    document.getElementById('status').textContent = 'online';
    for (const r of data.replies || []) {
      addMsg(r, 'in');
      await new Promise((ok) => setTimeout(ok, 400));
    }
  } catch (e) {
    typing.style.display = 'none';
    document.getElementById('status').textContent = 'online';
    addMsg('Connection issue, please try again.', 'in');
  }
}

document.getElementById('send').onclick = () => send();
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
document.querySelectorAll('.chip').forEach((c) => (c.onclick = () => send(c.textContent)));

// opening messages from the "clinic": short, Arabic-first, points at the chips
addMsg('أهلاً بيك في عيادة سمايل لطب الأسنان 🦷', 'in');
setTimeout(() => addMsg('أنا المساعد الذكي للعيادة: برد في ثواني، ٢٤ ساعة، بالعربي أو الإنجليزي. اسألني عن الأسعار، أو احجز ميعادك من هنا 👇\n\nI reply in seconds, 24/7, in Arabic or English. Ask about prices or book right here 👇', 'in'), 500);

// optional deep link: /demo?q=<message> auto-sends a first patient message
const q = new URLSearchParams(location.search).get('q');
if (q) setTimeout(() => send(q), 600);
</script>
</body>
</html>
